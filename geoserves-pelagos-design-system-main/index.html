<!-- MAIN -->
<main class="main" id="main" role="main">

      <span class="current">Welcome</span>
    </div>
    <div class="topbar-actions">

<!-- SEARCH MODAL -->
<div class="search-overlay" id="search-overlay" role="dialog" aria-modal="true" aria-label="Search" onclick="closeSearchOnOverlay(event)">
  <div class="search-modal">
    <div class="search-input-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ba3b8" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search-input" placeholder="Search components, tokens, foundations..." aria-label="Search design system" autocomplete="off" oninput="filterSearch(this.value)" />
      <kbd style="font-family:var(--font-sans);background:#f0f2f8;border:1px solid #dde1ed;border-radius:4px;padding:2px 7px;font-size:12px;color:#555;">esc</kbd>
    </div>
    <div class="search-results" id="search-results"></div>
    <div class="search-footer">
      <span><kbd>↑↓</kbd> navigate</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>
